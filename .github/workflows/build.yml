name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: 1.4.2

jobs:
  build:
    name: Typecheck, test & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run compile

      - name: Fetch bangs snapshot
        run: bun run snapshot

      - name: Unit tests
        run: bun test

      - name: Package Chrome
        run: bun run zip

      - name: Package Firefox (+ sources for AMO review)
        run: bun run zip:firefox

      - name: Lint Firefox build (AMO validator)
        run: bun run lint:firefox

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zips
          path: .output/*.zip
          # WXT writes to the hidden `.output/` dir, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error

  e2e:
    name: End-to-end (Chromium + Firefox)
    # Pinned: playwright-core 1.52 can't install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright-core install --with-deps chromium

      - name: Build
        run: |
          bun run build
          bun run build:firefox

      - name: Chromium e2e
        run: xvfb-run -a bun run e2e

      - name: Firefox e2e
        run: |
          firefox --version
          bun run e2e:firefox

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches package.json version
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sign exactly the build that was tested, not a fresh rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zips
          path: .output

      - name: Unpack Firefox build
        run: unzip -q ".output/bangskinesis-${GITHUB_REF_NAME#v}-firefox.zip" -d .output/firefox-mv3

      - name: Sign Firefox add-on (AMO unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: bun run sign:firefox

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.xpi
            .output/*-sources.zip
            .output/updates.json
          fail_on_unmatched_files: true
          generate_release_notes: true
